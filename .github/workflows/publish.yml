name: Publish Extension

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Sample/**'
      - README.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish-extension:
    name: Publish Azure DevOps Bicep extension
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # avoid shallow clone so nbgv can do its work.
          submodules: true

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Bicep
        run: |
          az config set bicep.use_binary_from_path=false
          az bicep install

      - name: Run nbgv
        id: nbgv
        uses: dotnet/nbgv@v0.5.1

      - name: Test
        run: dotnet test

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - name: Publish Extension
        shell: pwsh
        run: |
          # OCI repository names must be lowercase.
          [string] $repository = "${{ github.repository }}".ToLowerInvariant()
          [string] $target = "br:ghcr.io/${repository}:${{ steps.nbgv.outputs.SimpleVersion }}"
          ./Scripts/Publish-Extension.ps1 -Target $target

          "Published extension ``$target``." >> $env:GITHUB_STEP_SUMMARY
        # Bicep reads bicepconfig.json from the working directory; Infra/bicepconfig.json enables
        # 'ociEnabled' so non-ACR registries (ghcr.io) authenticate via Docker credentials.
        working-directory: ./Infra
